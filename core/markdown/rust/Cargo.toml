[package]
name = "markdown"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "markdown"
crate-type = ["cdylib", "staticlib"]

[dependencies]
doc = { path = "../../doc/rust" }
pulldown-cmark = { version = "0.13", default-features = false }

[profile.release]
opt-level = 2
panic = "abort"
lto = true
codegen-units = 1
strip = true

[workspace]

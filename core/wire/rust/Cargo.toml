[package]
name = "mote_http"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
ureq = "3.4.2"
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }

[workspace]

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"

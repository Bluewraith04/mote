[workspace]
members = [
    "crates/isa",
    "crates/contracts",
    "crates/platform",
    "crates/runtime",
    "crates/gc",
    "crates/ffi",
    "crates/gui",
    "crates/compiler",
    "crates/modules",
    "crates/pkg",
    "crates/cli",
]
resolver = "2"

[workspace.dependencies]
isa = { path = "crates/isa" }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"

# Only the interpreter's hot loop and the collector are tuned for speed; everything else is tuned for size.
[profile.release.package.runtime]
opt-level = 3

[profile.release.package.gc]
opt-level = 3

[profile.release.package.isa]
opt-level = 3

[profile.release.package.contracts]
opt-level = 3

# Painting and shaping text run on every scroll frame; at size-tuning a frame took 35 ms instead of 20 ms for 150 KB less.
[profile.release.package.gui]
opt-level = 3

[profile.release.package.cosmic-text]
opt-level = 3

[profile.release.package.harfrust]
opt-level = 3

[profile.release.package.swash]
opt-level = 3

[profile.release.package.tiny-skia]
opt-level = 3

[profile.release.package.tiny-skia-path]
opt-level = 3

[profile.release.package.skrifa]
opt-level = 3

[profile.release.package.read-fonts]
opt-level = 3


# Argon2 fills 19 MiB per hash; unoptimized it takes seconds, which slows every debug build and test.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

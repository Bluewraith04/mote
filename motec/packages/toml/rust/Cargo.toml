[package]
name = "mote_toml"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
toml = { version = "1.1.6", features = ["preserve_order"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }

[workspace]

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"

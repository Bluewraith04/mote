[package]
name = "mote_sqlite"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "cache"] }

[workspace]

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"

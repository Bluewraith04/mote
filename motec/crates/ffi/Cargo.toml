[package]
name = "ffi"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
isa = { path = "../isa" }
runtime = { path = "../runtime" }
contracts = { path = "../contracts" }
platform = { path = "../platform" }
parking_lot = "0.12"
toml = { version = "1.1.6", features = ["preserve_order"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
base64 = "0.23.1"
uuid = { version = "1.26.1", features = ["v4", "v7"] }
flate2 = "1.1.10"
tar = "0.4.46"
serde_yaml_ng = "0.10.0"
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
serde = "1.0.229"
form_urlencoded = "1.2.2"
httparse = "1.10.1"
http = "1.5.0"
percent-encoding = "2.3.2"
httpdate = "1.0.3"
sha2 = "0.11.0"
hmac = "0.13.0"
subtle = "2.6.1"
getrandom = "0.4.3"
hex = "0.4.3"
argon2 = "0.6.0"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }

[dev-dependencies]
cli = { path = "../cli" }

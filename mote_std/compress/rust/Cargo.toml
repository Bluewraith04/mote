[package]
name = "mote-compress"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "compress"
crate-type = ["cdylib", "staticlib"]

[dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[profile.release]
opt-level = 2
panic = "abort"
lto = true
codegen-units = 1
strip = true

[workspace]

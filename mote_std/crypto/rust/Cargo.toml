[package]
name = "mote-crypto"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "crypto"
crate-type = ["cdylib", "staticlib"]

[dependencies]
sha2 = { version = "0.11", default-features = false }
hmac = "0.13"
subtle = "2"

[profile.release]
opt-level = 2
panic = "abort"
lto = true
codegen-units = 1
strip = true

[workspace]

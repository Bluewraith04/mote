[package]
name = "mote-packages"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
testing = []

[dependencies]
mote-base.workspace = true
mote-abi.workspace = true
mote-syntax.workspace = true
mote-semantics.workspace = true
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }
sha2 = "0.11.1"
# zip's deflate-flate2 needs a flate2 backend, which flate2's default features pick.
flate2 = "1.1.10"

[build-dependencies]
flate2 = "1.1.10"

[dev-dependencies]
mote-semantics = { workspace = true, features = ["testing"] }
